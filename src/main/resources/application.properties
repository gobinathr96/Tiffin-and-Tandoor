# ---- Server ----
server.port=8085

# ---- MySQL Database ----
# Create the database first: CREATE DATABASE food_ordering_db;
spring.datasource.url=jdbc:mysql://localhost:3306/food_ordering_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=kul961
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# 'update' auto-creates/updates tables from your entities - perfect while learning.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---- Jackson (JSON) ----
spring.jackson.serialization.fail-on-empty-beans=false

# ---- Mail (bills are emailed here on every order) ----
# Using Gmail SMTP. You must send FROM a real Gmail account you control -
# Gmail will not let you send mail "as" someone else's address.
# 1) Put your own sender Gmail address in mail.username below.
# 2) Generate a 16-character Google "App Password" for that account
#    (Google Account -> Security -> 2-Step Verification -> App passwords)
#    and paste it into mail.password below (NOT your normal Gmail login password).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-restaurant-sender@gmail.com
spring.mail.password=your-16-char-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Every bill is emailed to this restaurant order-desk / server mailbox
restaurant.order-mail-to=s17173188@gmail.com
